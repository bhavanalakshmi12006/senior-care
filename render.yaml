services:
  - type: web
    name: senior-care-platform
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: senior_care
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        value: bhavanalakshmi12006@gmail.com
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: SeniorCare Care Network <bhavanalakshmi12006@gmail.com>
      - key: EMAIL_TO
        value: bhavanalakshmi12006@gmail.com
